name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: node --test --test-concurrency=4
        env:
          # Node 22's SQLite warning changes the stderr asserted by CLI tests.
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
      - run: npm pack --dry-run
